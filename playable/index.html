<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>킵고잉 / KeepGoing — 플레이</title>
<style>
  :root { --green:#16a34a; --ink:#0f172a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#0b1220; color:#e2e8f0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  #wrap { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:12px; }
  canvas { background:linear-gradient(#1e293b,#0f172a); border-radius:16px; touch-action:none;
    box-shadow:0 10px 40px rgba(0,0,0,.5); max-width:100%; height:auto; }
  .hint { font-size:13px; color:#94a3b8; text-align:center; line-height:1.6; }
  .hint b { color:#e2e8f0; }
  h1 { font-size:18px; margin:4px 0; }
  .tag { color:var(--green); font-weight:700; }
</style>
</head>
<body>
<div id="wrap">
  <h1>🏃 킵고잉 <span class="tag">KeepGoing</span></h1>
  <canvas id="c" width="400" height="640"></canvas>
  <div class="hint">
    <b>← →</b> 레인 이동 · <b>↑</b> 점프 · <b>↓</b> 슬라이드 · (모바일: 스와이프) · <b>Space</b> 시작/재시작<br/>
    빨간 <b>세로 광고판</b>=옆 레인으로 · 노랑 <b>현수막(위)</b>=점프 · 파랑 <b>현수막(아래)</b>=슬라이드 · 🌀 <b>포털</b>=특별 수집 스테이지
  </div>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const LANES = [80, 200, 320];
const GROUND = 520;

// ---- 점수 공식 (SPEC §2/§8) ----
function comboBonusFor(c){ if(c>0 && c%10===0){ if(c>=30)return 500; if(c>=20)return 250; return 100; } return 0; }
const floor = Math.floor;

let S; // state
function reset(){
  S = {
    mode:'title', lane:1, py:GROUND, vy:0, jumping:false, sliding:0,
    speed:230, distance:0, dodged:0, combo:0, maxCombo:0, comboBonus:0, nearMiss:0,
    specialScore:0, special:null, specialEntered:false, collected:{coin:0,big:0,heart:0,gold:0},
    obstacles:[], spawnT:0, portalDone:false, t:0, result:null, last:performance.now()
  };
}
reset();

function start(){ reset(); S.mode='play'; }

// ---- 입력 ----
function move(dir){
  if(S.mode==='title'||S.mode==='over'){ start(); return; }
  if(S.mode==='special'){ if(dir==='left')S.lane=Math.max(0,S.lane-1); if(dir==='right')S.lane=Math.min(2,S.lane+1); return; }
  if(S.mode!=='play') return;
  if(dir==='left') S.lane=Math.max(0,S.lane-1);
  else if(dir==='right') S.lane=Math.min(2,S.lane+1);
  else if(dir==='up' && !S.jumping && S.py>=GROUND){ S.jumping=true; S.vy=-560; }
  else if(dir==='down' && S.sliding<=0){ S.sliding=0.55; }
}
addEventListener('keydown',e=>{
  const k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];
  if(k){ e.preventDefault(); move(k); }
  if(e.code==='Space'){ e.preventDefault(); if(S.mode!=='play'&&S.mode!=='special') start(); }
});
let tsx=0,tsy=0;
cv.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;},{passive:true});
cv.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-tsx,dy=t.clientY-tsy;
  if(Math.abs(dx)<20&&Math.abs(dy)<20){ if(S.mode!=='play'&&S.mode!=='special')start(); return; }
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left'); else move(dy>0?'down':'up');
},{passive:true});
cv.addEventListener('mousedown',()=>{ if(S.mode!=='play'&&S.mode!=='special') start(); });

// ---- 스폰 ----
const OBS=['block','high','low'];
function spawn(){
  if(!S.portalDone && S.distance>260){ // 브랜드 포털
    S.portalDone=true;
    S.obstacles.push({type:'portal', lane:(Math.random()*3|0), y:-60});
    return;
  }
  const type=OBS[(Math.random()*OBS.length)|0];
  S.obstacles.push({type, lane:(Math.random()*3|0), y:-60, scored:false});
}

// ---- 특별 스테이지 ----
function enterSpecial(){
  S.mode='special';
  S.special={ time:15, drops:[], spawnT:0, combo:0 };
}
function updateSpecial(dt){
  const sp=S.special; sp.time-=dt; sp.spawnT-=dt;
  if(sp.spawnT<=0){ sp.spawnT=0.45;
    const r=Math.random(); const kind = r<0.5?'coin': r<0.7?'big': r<0.85?'heart':'gold';
    sp.drops.push({kind, lane:(Math.random()*3|0), y:-40});
  }
  const PTS={coin:20,big:100,heart:150,gold:500};
  for(const d of sp.drops){ d.y += (260+ (15-sp.time)*10)*dt;
    if(!d.got && d.y>GROUND-30 && d.y<GROUND+40 && d.lane===S.lane){
      d.got=true; sp.combo++; const add=PTS[d.kind];
      S.specialScore+=add; S.specialScore += sp.combo%5===0?50:0;
      const key={coin:'coin',big:'big',heart:'heart',gold:'gold'}[d.kind]; S.collected[key]++;
    }
  }
  sp.drops=sp.drops.filter(d=>d.y<H+40 && !d.got);
  if(sp.time<=0){ S.mode='play'; S.special=null; S.obstacles=[]; S.spawnT=0.8; }
}

// ---- 게임오버 ----
function gameOver(){
  const distanceMeters=floor(S.distance/10);
  const gameScore=distanceMeters*1 + S.dodged*10 + S.comboBonus + S.nearMiss + S.specialScore;
  const donationPoints=floor(gameScore*0.1);
  const durationSec=Math.max(1,Math.round(S.t));
  const valid = donationPoints===floor(gameScore*0.1) && distanceMeters<=durationSec*30 && gameScore<=durationSec*30*5+5000 && donationPoints<=100000;
  S.result={distanceMeters,gameScore,donationPoints,valid,durationSec};
  S.mode='over';
}

// ---- 업데이트 ----
function update(dt){
  if(S.mode==='special'){ updateSpecial(dt); return; }
  if(S.mode!=='play') return;
  S.t+=dt;
  S.speed=Math.min(560,S.speed+dt*16);
  S.distance+=S.speed*dt/ (1); // px
  // 점프 물리
  if(S.jumping){ S.vy+=1500*dt; S.py+=S.vy*dt; if(S.py>=GROUND){S.py=GROUND;S.jumping=false;S.vy=0;} }
  if(S.sliding>0) S.sliding-=dt;
  // 스폰
  S.spawnT-=dt; if(S.spawnT<=0){ S.spawnT=Math.max(0.55, 1.1 - S.speed/900); spawn(); }
  // 장애물 이동 + 충돌
  for(const o of S.obstacles){
    o.y += S.speed*dt;
    const atPlayer = o.y>GROUND-34 && o.y<GROUND+24;
    if(atPlayer && o.lane===S.lane && !o.hit){
      if(o.type==='portal'){ o.hit=true; enterSpecial(); return; }
      const avoided = (o.type==='high'&&!S.jumping&&S.py>=GROUND-2&&false) // high=현수막 위 → 점프로 피함
        ;
      let ok=false;
      if(o.type==='block') ok=false;            // 다른 레인으로 갔어야 함
      else if(o.type==='high') ok=S.jumping;     // 위 현수막 → 점프
      else if(o.type==='low') ok=S.sliding>0;    // 아래 현수막 → 슬라이드
      if(!ok){ o.hit=true; gameOver(); return; }
    }
    if(!o.scored && o.y>GROUND+24 && o.type!=='portal'){
      o.scored=true; S.dodged++; S.combo++; S.maxCombo=Math.max(S.maxCombo,S.combo);
      S.comboBonus+=comboBonusFor(S.combo);
      if(Math.random()<0.4) S.nearMiss+=5;
    }
  }
  S.obstacles=S.obstacles.filter(o=>o.y<H+60 && !o.hit);
}

// ---- 렌더 ----
function laneX(l){return LANES[l];}
function drawPlayer(){
  const x=laneX(S.lane); const sliding=S.sliding>0;
  const h=sliding?22:46, y=S.py-(sliding?0:0);
  ctx.fillStyle='#22d3ee';
  ctx.fillRect(x-16, y-h, 32, h);
  ctx.fillStyle='#0e7490'; ctx.fillRect(x-16, y-8, 32, 8);
}
function drawObstacle(o){
  const x=laneX(o.lane);
  if(o.type==='portal'){ ctx.fillStyle='#a855f7'; ctx.beginPath(); ctx.arc(x,o.y,26,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='20px sans-serif'; ctx.textAlign='center'; ctx.fillText('🌀',x,o.y+7); return; }
  if(o.type==='block'){ ctx.fillStyle='#ef4444'; ctx.fillRect(x-26,o.y-40,52,52); ctx.fillStyle='#fecaca'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillText('AD',x,o.y-10); }
  if(o.type==='high'){ ctx.fillStyle='#f59e0b'; ctx.fillRect(x-30,o.y-46,60,14); } // 위 현수막→점프
  if(o.type==='low'){ ctx.fillStyle='#3b82f6'; ctx.fillRect(x-30,o.y+2,60,14); }  // 아래→슬라이드
}
function hud(){
  const distanceMeters=floor(S.distance/10);
  const live=distanceMeters + S.dodged*10 + S.comboBonus + S.nearMiss + S.specialScore;
  ctx.fillStyle='#e2e8f0'; ctx.textAlign='left'; ctx.font='bold 16px sans-serif';
  ctx.fillText(`${live.toLocaleString()}점`, 12, 26);
  ctx.font='12px sans-serif'; ctx.fillStyle='#94a3b8';
  ctx.fillText(`${distanceMeters}m · 콤보 ${S.combo} · ${(S.speed/16).toFixed(0)}km/h`, 12, 44);
  ctx.textAlign='right'; ctx.fillStyle='#34d399';
  ctx.fillText(`💝 ${floor(live*0.1).toLocaleString()}P`, W-12, 26);
}
function center(lines){
  ctx.textAlign='center';
  let y=200;
  for(const [t,f,c] of lines){ ctx.fillStyle=c||'#e2e8f0'; ctx.font=f||'16px sans-serif'; ctx.fillText(t,W/2,y); y+= (parseInt(f)||16)+12; }
}
function render(){
  ctx.clearRect(0,0,W,H);
  // 레인 가이드
  ctx.strokeStyle='rgba(148,163,184,.15)'; ctx.lineWidth=2;
  for(const x of LANES){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  ctx.strokeStyle='rgba(148,163,184,.3)'; ctx.beginPath(); ctx.moveTo(0,GROUND+12); ctx.lineTo(W,GROUND+12); ctx.stroke();

  if(S.mode==='title'){
    center([['🏃 킵고잉','bold 30px sans-serif','#fff'],['KeepGoing','18px sans-serif','#34d399'],
      ['광고를 보지 않아도 되는 광고 게임','13px sans-serif','#94a3b8'],
      ['','10px sans-serif'],['▶ Space / 화면 탭으로 시작','16px sans-serif','#e2e8f0']]);
    return;
  }
  if(S.mode==='special'){
    const sp=S.special;
    ctx.fillStyle='rgba(22,163,74,.12)'; ctx.fillRect(0,0,W,H);
    for(const d of sp.drops){ const x=laneX(d.lane); const e={coin:'🪙',big:'📋',heart:'💚',gold:'🌟'}[d.kind];
      ctx.font='26px sans-serif'; ctx.textAlign='center'; ctx.fillText(e,x,d.y); }
    drawPlayer();
    ctx.fillStyle='#34d399'; ctx.textAlign='center'; ctx.font='bold 16px sans-serif';
    ctx.fillText(`⭐ 후원 스테이지 KEEP GREEN · ${sp.time.toFixed(1)}s`, W/2, 28);
    ctx.font='12px sans-serif'; ctx.fillStyle='#94a3b8';
    ctx.fillText('좌우로 이동해 브랜드 아이템 수집! (사망 없음)', W/2, 46);
    ctx.fillStyle='#e2e8f0'; ctx.fillText(`특별점수 ${S.specialScore.toLocaleString()}`, W/2, 64);
    return;
  }
  for(const o of S.obstacles) drawObstacle(o);
  drawPlayer();
  hud();
  if(S.mode==='over'){
    const r=S.result;
    ctx.fillStyle='rgba(2,6,23,.82)'; ctx.fillRect(0,0,W,H);
    center([
      ['GAME OVER','bold 26px sans-serif','#f87171'],
      [`최종 ${r.gameScore.toLocaleString()}점`,'bold 22px sans-serif','#fff'],
      [`이동 ${r.distanceMeters}m · 회피 ${S.dodged} · 최대콤보 ${S.maxCombo}`,'13px sans-serif','#94a3b8'],
      [`특별 ${S.specialScore.toLocaleString()} (🪙${S.collected.coin} 📋${S.collected.big} 💚${S.collected.heart} 🌟${S.collected.gold})`,'13px sans-serif','#94a3b8'],
      ['','8px sans-serif'],
      [`💝 기부 포인트 ${r.donationPoints.toLocaleString()}P`,'bold 20px sans-serif','#34d399'],
      [r.valid?'✅ 검증 통과 → 숲 복원 🌳 프로젝트에 반영':'❌ 검증 실패 → 미반영','13px sans-serif',r.valid?'#34d399':'#f87171'],
      ['','8px sans-serif'],
      ['▶ Space / 탭으로 다시하기','15px sans-serif','#e2e8f0'],
    ]);
  }
}

function loop(now){
  const dt=Math.min(0.05,(now-S.last)/1000); S.last=now;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
